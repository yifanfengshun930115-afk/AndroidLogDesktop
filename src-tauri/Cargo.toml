[package]
name = "android-log-desktop"
version = "0.1.6"
description = "Lightweight Android logcat desktop client."
authors = ["gzq"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "android_log_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
